<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Backoffice Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- html2canvas (pour rendre le HTML en image) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- DOMPurify (pour sécuriser le HTML pour jsPDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.4.3/purify.min.js"></script>


</head>
<body class="container mt-5">

<h2>🔐 Backoffice</h2>

<!-- FORMULAIRE LOGIN -->
<div id="login">
    <input id="user" class="form-control mb-2" placeholder="Utilisateur">
    <input id="password" type="password" class="form-control mb-2" placeholder="Mot de passe">
    <input id="primary_key" type="password" class="form-control mb-2"
           placeholder="Primary API Key">

    <input id="secondary_key" type="password" class="form-control mb-3"
           placeholder="Secondary API Key">

    <button class="btn btn-primary" onclick="login()">Connexion</button>
</div>

    <!-- PANEL ADMIN -->
    <div id="panel" style="display:none">

        <!-- BOUTON DÉCONNEXION -->
        <button class="btn btn-secondary mb-3" onclick="logout()">Déconnexion</button>



        <div class="container my-5 p-4 bg-white shadow-sm">
        <h2 class="mb-4">Générateur de Facture</h2>

        <div class="mb-3">
            <label for="orderNumberInput" class="form-label">Numéro de commande</label>
            <input type="text" id="orderNumberInput" class="form-control" placeholder="Ex: 39d45487-05df-4695-bf04-170b7a5a7e39">
        </div>

        <button id="generateInvoiceBtn" class="btn btn-primary">Générer la facture PDF</button>

        <div id="message2" class="mt-3"></div>
       </div>




        <!-- COMMANDES -->
        <!-- Télécharger CSV -->
        <div class="container my-5 p-4 bg-white shadow-sm">
            <button id="downloadBtnOrders" class="btn btn-success btn-lg" onclick="downloadOrdersCSV()">
                Télécharger Orders
            </button>
        </div>
        <h3 class="mt-4">📦 Commandes</h3>
        <table class="table table-bordered" id="orders"></table>






</br></br></br>

    <!-- Télécharger CSV -->
    <div class="container my-5 p-4 bg-white shadow-sm">
        <button id="downloadBtn" class="btn btn-success btn-lg" onclick="downloadProductsCSV()">
            Télécharger Products
        </button>
    </div>

    <!-- PRODUITS -->
    <h3 class="mt-4">🛒 Produits</h3>
    <!-- <button class="btn btn-warning mb-2" onclick="saveProducts()">💾 Sauvegarder</button> -->
    <table class="table table-bordered" id="products"></table>






<div class="container py-5">

    <h1 class="mb-4 text-center">Gestion des Produits</h1>



    <!-- Section Upload -->
    <div class="container my-5 p-4 bg-white shadow-sm">
        <h2 class="h5 mb-3">Importer les produits</h2>
        <div class="mb-3">
            <input class="form-control" type="file" id="fileInput" accept=".csv">
        </div>
        <button id="uploadBtn" class="btn btn-primary">Uploader CSV</button>
        <div id="message" class="mt-3"></div>
    </div>

</div>















    <!-- AJOUT PRODUIT -->
    <h3 class="mt-4">➕ Ajouter un produit</h3>
    <div class="mb-3">
        <input class="form-control mb-1" id="new_id" placeholder="ID (numéro unique)">
        <input class="form-control mb-1" id="new_name" placeholder="Nom du produit">
        <input class="form-control mb-1" id="new_price" placeholder="Prix">
        <input class="form-control mb-1" id="new_promo_price" placeholder="Prix promo">
        <input class="form-control mb-1" id="new_promo" placeholder="Promo (yes/no)">
        <input class="form-control mb-1" id="new_description" placeholder="Description">
        <input class="form-control mb-1" id="new_images" placeholder="Images (séparées par |)">
        <input class="form-control mb-1" id="new_stock" placeholder="Stock (quantité disponible)">
        <button class="btn btn-success mt-2" onclick="saveProducts()">Ajouter produit</button>
    </div>

</div>

<script src="admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
