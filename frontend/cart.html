    <div class="text-center mt-3">
        <button class="btn btn-cart" style="
            width: 50%;

            font-size: 16px;
            font-weight: bold;
        " onclick="order()">Commander</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderCart() {
    const cartList = document.getElementById("cart-list");
    cartList.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
        total += item.price * item.quantity;
        cartList.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center">
            ${item.name} x 
            <input type="number" min="1" value="${item.quantity}" style="width:60px;" onchange="updateQuantity(${item.id}, this.value)">
            <span>${(item.price * item.quantity).toFixed(2)} €</span>
            <button class="btn btn-sm btn-danger" onclick="removeFromCart(${item.id})">X</button>
        </li>`;
    });

    document.getElementById("total").innerText = total.toFixed(2);
    localStorage.setItem("cart", JSON.stringify(cart));
}

function updateQuantity(id, qty) {
    const item = cart.find(p => p.id == id);
    if (item) item.quantity = parseInt(qty);
    renderCart();
}

function removeFromCart(id) {
    cart = cart.filter(p => p.id != id);
    renderCart();
}

// Commander
function order() {
    if (!cart.length) {
        alert("Panier vide");
        return;
    }

    const customer = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value
    };

    if (!customer.name || !customer.phone) {
        alert("Nom et téléphone obligatoires");
        return;
    }

    fetch("/api/order", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            customer: customer,
            items: cart
        })
